name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-no-real-data.mjs
      - run: node --test tests/
      - name: sw version is up to date
        run: node scripts/build-version.mjs && git diff --exit-code sw.js
